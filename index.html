<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1324">
<title>Timetable</title>

<style>
  :root {
    --bg: #0b1324;
    --card: #141c2f;
    --muted: #8ea0c4;
    --text: #e6eefc;
    --accent: #7bd389;
    --accent-text: #08210f;
    --tag: #1e2742;
    --error: #ff9e9e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, Arial, sans-serif;
  }

  body { min-height: 100vh; }

  .wrap {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 18px;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .title { font-weight: 800; font-size: 21px; letter-spacing: -0.2px; }
  .sub { color: var(--muted); font-size: 13px; }

  .mono {
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 15px;
    margin: 12px 0;
  }

  .big { font-weight: 750; font-size: 16px; margin-bottom: 5px; }

  .status-value { color: var(--text); font-size: 15px; word-break: break-word; }

  .tag {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    background: var(--tag);
    color: #cfe3ff;
    font-weight: 650;
    font-size: 12px;
    margin-left: 6px;
    margin-top: 6px;
  }

  pre { white-space: pre-wrap; margin: 0; font-family: inherit; }

  button {
    appearance: none;
    border: 0;
    border-radius: 10px;
    padding: 10px 14px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 800;
    cursor: pointer;
    min-width: 82px;
  }

  button:disabled { opacity: 0.65; cursor: wait; }

  .error {
    display: none;
    color: var(--error);
    font-size: 12px;
    margin-top: 10px;
    overflow-wrap: anywhere;
  }

  .updated { margin-top: 7px; }

  .restRow {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .restRow:last-child { border-bottom: none; }
  .restRow .time { color: var(--muted); white-space: nowrap; }
</style>
</head>

<body>
  <main class="wrap">

    <header class="row">
      <div>
        <div class="title" id="pageTitle">Timetable</div>
        <div id="today" class="sub mono">—</div>
      </div>
      <div id="badges" class="row" style="gap:6px"></div>
    </header>

    <section class="card">
      <div class="big">Now</div>
      <div id="now" class="status-value mono">Loading…</div>
    </section>

    <section class="card">
      <div class="big">Next</div>
      <div id="next" class="status-value mono">Loading…</div>
    </section>

    <section class="card">
      <div class="row">
        <div class="big" style="margin-bottom:0">Rest of day</div>
        <button id="refreshBtn" type="button">Refresh</button>
      </div>

      <div id="rest" class="sub mono" style="margin-top:10px">Loading…</div>

      <div id="err" class="error"></div>

      <div class="updated sub mono">Last updated: <span id="updated">—</span></div>
    </section>

  </main>

<script>
  const DATA_URL = 'data.json';
  const TZ = 'Europe/London';
  const REFRESH_MS = 60000;

  let DATA = null;
  let timer = null;
  let inFlight = false;

  const button = document.getElementById('refreshBtn');

  function setBusy(busy) {
    inFlight = busy;
    button.disabled = busy;
    button.textContent = busy ? 'Refreshing…' : 'Refresh';
  }

  function setError(message) {
    const el = document.getElementById('err');
    if (message) {
      el.textContent = message;
      el.style.display = 'block';
    } else {
      el.textContent = '';
      el.style.display = 'none';
    }
  }

  function pill(text) {
    const span = document.createElement('span');
    span.className = 'tag';
    span.textContent = text;
    return span;
  }

  // ---- Europe/London-aware clock, independent of device timezone ----
  function londonParts(date) {
    const dtf = new Intl.DateTimeFormat('en-GB', {
      timeZone: TZ,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false,
      weekday: 'long'
    });
    const parts = {};
    dtf.formatToParts(date).forEach(p => { parts[p.type] = p.value; });
    const iso = `${parts.year}-${parts.month}-${parts.day}`;
    const hhmm = `${parts.hour}:${parts.minute}`;
    return { iso, hhmm, weekday: parts.weekday, minutes: hhmmToMinutes(hhmm) };
  }

  function hhmmToMinutes(hhmm) {
    const m = String(hhmm).match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }

  function isoToUTCNoon(iso) {
    // Treat the calendar date as a fixed point (midday) to avoid DST edge issues
    // when diffing whole days/weeks.
    return new Date(iso + 'T12:00:00Z');
  }

  function mondayOf(iso) {
    // iso is a plain calendar date; compute the Monday of that week.
    const d = isoToUTCNoon(iso);
    const dow = d.getUTCDay(); // 0=Sun..6=Sat
    const diff = (dow === 0 ? -6 : 1 - dow);
    d.setUTCDate(d.getUTCDate() + diff);
    return d.toISOString().slice(0, 10);
  }

  function weekTypeFor(iso, anchorMonday) {
    const monday = mondayOf(iso);
    const days = Math.round((isoToUTCNoon(monday) - isoToUTCNoon(anchorMonday)) / 86400000);
    const weeks = Math.round(days / 7);
    const mod = ((weeks % 2) + 2) % 2;
    return mod === 0 ? 'A' : 'B';
  }

  function inTerm(iso, terms) {
    return terms.some(t => iso >= t.start && iso <= t.end);
  }

  function clean(s) {
    if (s === undefined || s === null) return '—';
    const t = String(s).trim();
    return t ? t : '—';
  }

  function render() {
    setError('');

    const now = new Date();
    const { iso, hhmm, weekday, minutes } = londonParts(now);

    document.getElementById('pageTitle').textContent =
      (DATA.teacherName ? DATA.teacherName.split(' ')[0] + "'s" : "The") + ' Timetable';
    document.getElementById('today').textContent = `${weekday} · ${hhmm}`;

    const badges = document.getElementById('badges');
    badges.innerHTML = '';

    const schoolStartM = hhmmToMinutes(DATA.schoolDayStart);
    const schoolEndM = hhmmToMinutes(DATA.schoolDayEnd);
    const outsideHours = (minutes < schoolStartM || minutes >= schoolEndM);

    const isWeekend = (weekday === 'Saturday' || weekday === 'Sunday');
    const isInset = (DATA.insetDays || []).includes(iso);
    const isTermTime = inTerm(iso, DATA.terms || []);
    const weekType = isTermTime ? weekTypeFor(iso, DATA.weekAAnchorMonday) : null;

    let statusMode; // 'lessons' | 'weekend' | 'holiday' | 'inset'
    if (!isTermTime) statusMode = 'holiday';
    else if (isWeekend) statusMode = 'weekend';
    else if (isInset) statusMode = 'inset';
    else statusMode = 'lessons';

    if (statusMode === 'holiday') badges.appendChild(pill('Out of term'));
    else if (statusMode === 'weekend') badges.appendChild(pill('Weekend'));
    else if (statusMode === 'inset') badges.appendChild(pill('Inset day'));
    else badges.appendChild(pill('Week ' + weekType));

    if (statusMode === 'lessons' && outsideHours) badges.appendChild(pill('Outside school hours'));

    const nowEl = document.getElementById('now');
    const nextEl = document.getElementById('next');
    const restEl = document.getElementById('rest');

    if (statusMode !== 'lessons') {
      const label = {
        holiday: 'Out of term — no lessons today',
        weekend: 'Weekend — no lessons today',
        inset: 'Inset day — no lessons today'
      }[statusMode];
      nowEl.textContent = label;
      nextEl.textContent = '—';
      restEl.textContent = '—';
    } else {
      const periods = DATA.periods || [];
      const daySlots = (DATA.timetable[weekType] && DATA.timetable[weekType][weekday]) || [];

      let currentIdx = -1, nextIdx = -1;
      periods.forEach((p, i) => {
        const sM = hhmmToMinutes(p.start), eM = hhmmToMinutes(p.end);
        if (minutes >= sM && minutes < eM) currentIdx = i;
        if (nextIdx === -1 && sM > minutes) nextIdx = i;
      });

      function subjectAt(i) {
        return clean(daySlots[i]);
      }

      if (currentIdx === -1) {
        nowEl.textContent = 'Between periods';
      } else {
        const p = periods[currentIdx];
        nowEl.textContent = `${subjectAt(currentIdx)} (${p.start}–${p.end})`;
      }

      if (nextIdx === -1) {
        nextEl.textContent = 'None — that’s the end of the day';
      } else {
        const p = periods[nextIdx];
        nextEl.textContent = `${subjectAt(nextIdx)} (${p.start})`;
      }

      const rest = [];
      periods.forEach((p, i) => {
        const sM = hhmmToMinutes(p.start);
        if (sM > minutes) rest.push(`${p.start} – ${subjectAt(i)}`);
      });
      restEl.textContent = rest.length ? rest.join('\n') : '—';
    }

    document.getElementById('updated').textContent =
      now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  async function requestData() {
    if (inFlight) return;
    setBusy(true);
    setError('');
    try {
      if (!DATA) {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('Could not load data.json (' + res.status + ')');
        DATA = await res.json();
      }
      render();
    } catch (e) {
      setError('Failed to refresh: ' + (e && e.message ? e.message : 'Unknown error'));
    } finally {
      setBusy(false);
    }
  }

  button.addEventListener('click', () => { DATA = null; requestData(); });

  function startTimer() {
    if (!timer) timer = setInterval(requestData, REFRESH_MS);
  }
  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopTimer();
    else { requestData(); startTimer(); }
  });

  requestData();
  startTimer();
</script>
</body>
</html>
